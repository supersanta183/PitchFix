<div class="meter" [attr.data-verdict]="judgement()?.verdict ?? 'idle'">
  <div class="track" aria-hidden="true">
    <div class="zone" [style.--zone-fraction]="zoneWidthPercent() / 100"></div>
    <div class="center"></div>
    @if (judgement()) {
      <div class="needle" [style.--needle-position]="needlePercent() / 100"></div>
    }
  </div>
  <div class="labels" aria-hidden="true">
    <span>Low</span>
    <span>High</span>
  </div>
  <p class="verdict">
    <span class="message" aria-live="polite">{{ message() }}</span>
    <span class="cents">{{ cents() }}</span>
  </p>
</div>
